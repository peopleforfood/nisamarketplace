<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b7f3b"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FoodTO"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<title>FoodTO Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font:16px system-ui,-apple-system,sans-serif;overscroll-behavior:none}
#map{position:fixed;inset:0;bottom:calc(64px + env(safe-area-inset-bottom))}
#search{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:5;display:flex;gap:8px;align-items:center;background:#fff;border-radius:28px;box-shadow:0 2px 8px #0003;padding:0 16px;height:52px}
#search input{flex:1;border:0;outline:0;font-size:17px;background:none}
#results{position:fixed;top:calc(68px + env(safe-area-inset-top));left:12px;right:12px;z-index:5;background:#fff;border-radius:16px;box-shadow:0 2px 8px #0003;display:none}
#results div{padding:16px;min-height:52px}
.btn{position:fixed;right:14px;z-index:4;width:52px;height:52px;border-radius:26px;border:0;background:#fff;box-shadow:0 2px 8px #0004;font-size:22px}
#locate{bottom:calc(84px + env(safe-area-inset-bottom))}
.pin{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pin span{width:30px;height:30px;border-radius:50% 50% 50% 0;background:#1b7f3b;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px #0006}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;display:flex;border-top:1px solid #ddd}
#nav button{flex:1;border:0;background:none;font-size:13px;color:#666}#nav button b{display:block;font-size:22px}#nav .on{color:#1b7f3b;font-weight:600}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 16px #0003;padding:8px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .18s ease-out;touch-action:none}
#sheet.open{transform:none}#grab{width:44px;height:5px;border-radius:3px;background:#ccc;margin:4px auto 12px}
#sheet h2{margin:0 0 4px;font-size:20px}#sheet .cat{color:#1b7f3b;font-size:14px;margin-bottom:10px}#sheet p{margin:6px 0;font-size:15px;color:#333}
.acts{display:flex;gap:10px;margin-top:14px}.acts a{flex:1;text-align:center;padding:15px;border-radius:12px;background:#1b7f3b;color:#fff;text-decoration:none;font-weight:600}.acts a.sec{background:#e8f3eb;color:#1b7f3b}
#toast{position:fixed;top:40%;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:12px 18px;border-radius:12px;z-index:9;display:none}
</style></head><body>
<div id="map"></div>
<div id="search">🔍<input id="q" placeholder="Search independent food in Toronto" autocomplete="off"></div>
<div id="results"></div>
<button class="btn" id="locate" aria-label="Locate me">◎</button>
<div id="sheet"><div id="grab"></div><div id="card"></div></div>
<nav id="nav"><button class="on"><b>🗺️</b>Map</button><button data-s><b>📷</b>Scan</button><button data-s><b>✨</b>Discover</button><button data-s><b>💬</b>Chat</button></nav>
<div id="toast">Coming soon</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const $=s=>document.querySelector(s);let biz=[];
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-79.41207,43.6554402],zoom:15,attributionControl:{compact:true},dragRotate:false,pitchWithRotate:false});
map.touchZoomRotate.disableRotation();
const sheet=$('#sheet');
function open(b){$('#card').innerHTML=`<h2>${b.name}</h2><div class="cat">${b.category}</div><p>📍 ${b.address}</p><p>🕒 ${b.hours}</p><p>📞 ${b.phone}</p><p>🌐 <a href="${b.website}" target="_blank" rel="noopener">${b.website.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]}</a></p><div class="acts"><a href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank">Directions</a><a class="sec" href="tel:${b.phone.replace(/[^\d+]/g,'')}">Call</a></div>`;sheet.style.transform='';sheet.classList.add('open');map.easeTo({center:[b.lng,b.lat],offset:[0,-120],duration:300})}
function close(){sheet.style.transform='';sheet.classList.remove('open')}
map.on('click',close);
let y0=null,dy=0;sheet.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;sheet.style.transition='none'},{passive:true});
sheet.addEventListener('touchmove',e=>{dy=Math.max(0,e.touches[0].clientY-y0);sheet.style.transform=`translateY(${dy}px)`},{passive:true});
sheet.addEventListener('touchend',()=>{sheet.style.transition='';if(dy>60)close();else sheet.style.transform='';y0=null});
$('#grab').onclick=close;
fetch('businesses.json').then(r=>r.json()).then(d=>{biz=d;d.forEach(b=>{const el=document.createElement('div');el.className='pin';el.innerHTML='<span></span>';el.addEventListener('click',e=>{e.stopPropagation();open(b)});new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([b.lng,b.lat]).addTo(map)})});
const q=$('#q'),res=$('#results');
q.oninput=()=>{const t=q.value.trim().toLowerCase();const m=t?biz.filter(b=>(b.name+b.category+b.address+b.description).toLowerCase().includes(t)):[];res.innerHTML=m.map((b,i)=>`<div data-i="${biz.indexOf(b)}">${b.name}<br><small>${b.address}</small></div>`).join('')||(t?'<div>No matches</div>':'');res.style.display=t?'block':'none'};
res.onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;open(biz[d.dataset.i]);res.style.display='none';q.blur()};
let me;$('#locate').onclick=()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{const c=[p.coords.longitude,p.coords.latitude];if(!me){const el=document.createElement('div');el.style.cssText='width:18px;height:18px;border-radius:9px;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px #1a73e833';me=new maplibregl.Marker({element:el})}me.setLngLat(c).addTo(map);map.flyTo({center:c,zoom:15,duration:600})},()=>toast('Location unavailable'),{enableHighAccuracy:true,timeout:8000})};
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1200)}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>toast('Coming soon'));
</script></body></html>
